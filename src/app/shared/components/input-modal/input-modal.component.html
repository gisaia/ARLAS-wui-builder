<div mat-dialog-content>
  <h1 class="modal_title" mat-dialog-title>
    {{ (data?.title ?? 'Dashboard name') | translate }}
  </h1>
  <div>{{data?.message | translate}}</div>
  <mat-form-field>
    <input matInput tabindex="1" [(ngModel)]="textName" (keypress)="pressEvent($event)">
  </mat-form-field>
</div>
<div mat-dialog-actions>
  @if (!data?.noCancel) {
    <button matButton="outlined" class="modal_button" (click)="cancel()"
      tabindex="-1">{{ 'Cancel' | translate }}</button>
  }
  <button matButton="filled" color="primary" class="modal_button" [mat-dialog-close]="textName" [disabled]="!textName"
    tabindex="2">{{ 'OK' | translate }}</button>
</div>
