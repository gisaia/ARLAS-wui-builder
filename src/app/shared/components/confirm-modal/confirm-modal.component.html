<h1 mat-dialog-title>{{'Are you sure?' | translate}}</h1>
<div mat-dialog-content>
    <p>{{ data.message | translate }}</p>
</div>
<div mat-dialog-actions>
    <button matButton="outlined" color="warn" cdkFocusInitial [mat-dialog-close]="false">{{'Cancel' | translate}}</button>
    <button matButton="filled" color="primary" [mat-dialog-close]="true">{{ 'Yes' | translate}}</button>
</div>
