<div mat-dialog-title>{{'Update tab' | translate}}</div>
<div mat-dialog-content [formGroup]="tabForm">
  <div class="edit-tab-top">
    <mat-form-field>
      <mat-label>{{'Name' | translate}}</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>
    <arlas-config-icon-picker [control]="tabForm.controls.icon"></arlas-config-icon-picker>
  </div>
  <div>
    <mat-form-field style="width: 100%;">
      <mat-label>{{'Display' | translate}}</mat-label>
      <mat-select formControlName="display" (selectionChange)="displayChange($event)">
          <mat-option [value]="'both'">{{ 'Text and icon' | translate}}</mat-option>
          <mat-option [value]="'text'">{{'Only text' | translate}}</mat-option>
          <mat-option [value]="'icon'">{{'Only icon' | translate}}</mat-option>
      </mat-select>
  </mat-form-field>
  </div>
</div>
<div mat-dialog-actions>
  <button matButton="outlined" [mat-dialog-close]>{{'Cancel' | translate}}</button>
  <button cdkFocusInitial [mat-dialog-close]="tabForm.value" matButton="filled" color="primary">
    {{'Validate' | translate}}</button>
</div>
