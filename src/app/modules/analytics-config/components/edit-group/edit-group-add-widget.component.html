<div mat-dialog-title>
  {{'Choose widget type' | translate}}
</div>
<div mat-dialog-content>
  <mat-radio-group [(ngModel)]="widgetType" class="group">
    @for (types of contentTypes; track types; let idx = $index) {
      <mat-radio-button class="widget-type"
        [value]="types.label" [disabled]="types.label === 'resultlist'"
        [matTooltip]="((types.label === 'resultlist') ?  'Data tables are out of analytics' : types.label) | translate"
        [matTooltipPosition]="idx%2 !== 0 ? 'right' : 'left'">
        @if (types.iconType == 'svg') {
          <mat-icon class="icon" svgIcon="{{types.icon}}"></mat-icon>
        }
        @if (types.iconType == 'icon') {
          <mat-icon class="icon">{{types.icon}}</mat-icon>
        }
        {{types.label | translate}}
      </mat-radio-button>
    }
  </mat-radio-group>
</div>
<div mat-dialog-actions>
  <button matButton="filled" class="modal_button" color="primary" [mat-dialog-close]="widgetType"
  [disabled]="!widgetType" tabindex="2">{{ 'Add' | translate }}</button>
  <button matButton="outlined" class="modal_button" (click)="cancel()" tabindex="-1">{{ 'Cancel' | translate }}</button>
</div>
