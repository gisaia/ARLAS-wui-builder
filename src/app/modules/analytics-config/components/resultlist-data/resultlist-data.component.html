<mat-tab-group mat-stretch-tabs class="mat-elevation-z1">
  <mat-tab #columns>
    <ng-template mat-tab-label>
      <span [class.tab-error]="control.controls.columns.touched && control.controls.columns.invalid && !columns.isActive">
        {{'Columns' | translate}}
      </span>
    </ng-template>
    <arlas-edit-resultlist-columns [control]="control.controls.columns" [collection]="control.controls.collection">
    </arlas-edit-resultlist-columns>
  </mat-tab>
    <mat-tab #hybrid>
        <ng-template mat-tab-label>
      <span [class.tab-error]="control.controls.hybrid.touched && control.controls.hybrid.invalid && !columns.isActive">
        {{'Hybrid list' | translate}}
      </span>
        </ng-template>
        <arlas-edit-hybrid-resultlist-columns [control]="control.controls.hybrid" [collection]="control.controls.collection">
        </arlas-edit-hybrid-resultlist-columns>
    </mat-tab>
  <mat-tab #details>
    <ng-template mat-tab-label>
      <span [class.tab-error]="control.controls.details.touched && control.controls.details.invalid && !details.isActive">
        {{'Details' | translate}}
      </span>
    </ng-template>

    <div class="details-title">
      <arlas-config-element [fullSize]="!detailsTitleControl.description">
        <div form-fields>
          <arlas-config-form-control [control]="detailsTitleControl"></arlas-config-form-control>
        </div>
        @if (detailsTitleControl.description) {
          <div description>
            {{ detailsTitleControl.description | translate}}
          </div>
        }
      </arlas-config-element>
    </div>
    <arlas-edit-resultlist-details [control]="control.controls.details" [collection]="control.controls.collection">
    </arlas-edit-resultlist-details>
  </mat-tab>
</mat-tab-group>
