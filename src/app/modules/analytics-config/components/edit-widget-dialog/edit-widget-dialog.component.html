<h1 mat-dialog-title>{{ dialogData.widgetType | translate | titlecase }}</h1>
@if (formGroup.controls['title']) {
  <arlas-config-form-control [control]="$any(formGroup.controls['title'])"></arlas-config-form-control>
}

<div mat-dialog-content>
  <arlas-config-form-group [configFormGroup]="formGroup" [defaultKey]="defaultKey">
  </arlas-config-form-group>
</div>

<div mat-dialog-actions>
  <button matButton="outlined" [mat-dialog-close]>{{'Cancel' | translate}}</button>
  <button cdkFocusInitial (click)="save()" matButton="filled" color="primary">{{'Validate' | translate}}</button>
</div>
