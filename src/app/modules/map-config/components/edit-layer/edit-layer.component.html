<h3 style="font-weight: 500;">{{'Edit a layer' | translate}}</h3>

@if (layerFg) {
    <arlas-config-form-group [configFormGroup]="layerFg" [parentConfigFormGroup]="layerFg" defaultKey="map.layer"></arlas-config-form-group>
}

<div class="action-buttons">
    <button class="cancel-button" matButton="outlined" (click)="forceCanExit = true"
        [routerLink]="['', 'map-config', 'layers']" queryParamsHandling="preserve">{{ 'Cancel' | translate}} </button>
    <button matButton="filled" color="primary" type="submit" (click)="submit()">{{ 'Validate' | translate}} </button>
</div>
