########################################################
############   AUTHENTICATION SETTINGS   ###############
########################################################
authentication:
  use_authent: true
  auth_mode: openid
  url: https://site.arlas.k8s
  force_connect: false
  use_discovery: true
  threshold: 60000
  issuer: https://keycloak.arlas.k8s/realms/arlas
  client_id: arlas-front
  redirect_uri: https://localhost:4200/callback
  silent_refresh_redirect_uri: https://site.arlas.k8s/hub/silent-refresh.html
  scope: profile
  token_endpoint: NOT_CONFIGURED
  userinfo_endpoint: NOT_CONFIGURED
  jwks_endpoint: NOT_CONFIGURED
  login_url: NOT_CONFIGURED
  logout_url: NOT_CONFIGURED
  show_debug_information: false
  require_https: false
  response_type: code
  silent_refresh_timeout: 1000
  timeout_factor: 0.75
  session_checks_enabled: true
  clear_hash_after_login: true
  storage: memorystorage
  disable_at_hash_check: true
  dummy_client_secret: NOT_CONFIGURED
  custom_query_params: []
  sign_up_enabled: false

########################################################
############   Persistence SETTINGS   ##################
########################################################
persistence:
  url: https://site.arlas.k8s/persist
########################################################
############   Permissions SETTINGS   ##################
########################################################
permission:
  url: https://site.arlas.k8s/permissions
########################################################
############        URLs to WUI             ############
########################################################
arlas_wui_url: /wui
links: []
########################################################
############        Basemaps                ############
########################################################
basemaps: [ {"name":"Contrast","url":"/wui/assets/basemap/styles/protomap-contrast.json","image":"/wui/assets/basemap/quicklook/contrast.png", "type": "protomap"}, {"name":"Dark","url":"/wui/assets/basemap/styles/protomap-dark.json","image":"/wui/assets/basemap/quicklook/dark.png", "type": "protomap"}, {"name":"Grayscale","url":"/wui/assets/basemap/styles/protomap-grayscale.json","image":"/wui/assets/basemap/quicklook/grayscale.png", "type": "protomap"}, {"name":"Light","url":"/wui/assets/basemap/styles/protomap-light.json","image":"/wui/assets/basemap/quicklook/light.png", "type": "protomap"}, {"name":"White","url":"/wui/assets/basemap/styles/protomap-white.json","image":"/wui/assets/basemap/quicklook/white.png", "type": "protomap"} ]
tab_name:  ARLAS-wui-builder
external_node_page: true
external_node_schemas: []
histogram:
  max_buckets: 200
  export_nb_buckets: 1000
use_time_filter: false
enable_advanced_features: false
terrain: { "type": "raster-dem", "tiles": ["https://tiles.mapterhorn.com/{z}/{x}/{y}.webp"], "encoding": terrarium, "tileSize": 512 }